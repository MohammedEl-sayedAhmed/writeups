# Weekly version-update PRs for pinned GitHub Actions and npm packages.
# Without this, SHA-pinning in workflows means we'd silently miss patches.
# This file sets the weekly version updates. Dependabot alerts and security
# updates are turned on in the repo settings, and security-fix PRs arrive
# outside this schedule.

version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - github-actions

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - npm
    # TypeScript 7 is out, but @astrojs/check and typescript-eslint accept
    # only up to 6.x. Skip TypeScript majors until both support the next one.
    ignore:
      - dependency-name: "typescript"
        update-types:
          - "version-update:semver-major"
    groups:
      # astro core and its first-party integrations are peer-coupled: a new
      # astro major requires the matching @astrojs/* major and vice versa
      # (@astrojs/mdx@7 peer-requires astro@^7). Group ALL update-types,
      # majors included, so co-dependent bumps travel in one PR that `npm ci`
      # can resolve. Dependabot assigns each dependency to the first matching
      # group, so this must precede minor-and-patch. Note: in November 2026
      # an astro bump still arrived in the minor-and-patch group.
      astro:
        patterns:
          - "astro"
          - "@astrojs/*"
        update-types:
          - major
          - minor
          - patch
      # vitest and @vitest/coverage-v8 must stay on the same version, so
      # their bumps, majors included, travel in one PR.
      vitest:
        patterns:
          - "vitest"
          - "@vitest/*"
        update-types:
          - major
          - minor
          - patch
      # ESLint and its plugins are peer-coupled in the same way.
      eslint:
        patterns:
          - "eslint"
          - "@eslint/*"
          - "typescript-eslint"
          - "eslint-plugin-astro"
        update-types:
          - major
          - minor
          - patch
      # Everything else: batch minor/patch to reduce PR noise; other majors
      # stay individual.
      minor-and-patch:
        update-types:
          - minor
          - patch
