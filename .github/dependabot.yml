# Auto-PRs when a pinned GitHub Action gets a security or version update.
# Without this, SHA-pinning in workflows means we'd silently miss patches.

version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - github-actions

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - npm
    groups:
      # astro core and its first-party integrations are peer-coupled: a new
      # astro major requires the matching @astrojs/* major and vice versa
      # (@astrojs/mdx@7 peer-requires astro@^7). Group ALL update-types,
      # majors included, so co-dependent bumps travel in one PR that `npm ci`
      # can resolve. Dependabot assigns each dependency to the first matching
      # group, so this must precede minor-and-patch.
      astro:
        patterns:
          - "astro"
          - "@astrojs/*"
        update-types:
          - major
          - minor
          - patch
      # Everything else: batch minor/patch to reduce PR noise; other majors
      # stay individual.
      minor-and-patch:
        update-types:
          - minor
          - patch
